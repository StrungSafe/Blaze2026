# nginx config for the template tools image (templates/Dockerfile).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Dev-only tool: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri /index.html;
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Always fetch a fresh index.html so new builds show up.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
